[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-offline"
version = "1.0.0"
description = "Keeps Phantom Abyss playable after its servers shut down"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately empty. Everything the client needs to play -- capture, host,
# patch, launch -- is in the standard library. That keeps the download small,
# keeps a compiled crypto library out of the bundle, and gives a virus scanner
# less to take an interest in when the whole thing is frozen into one file.
dependencies = []

[project.optional-dependencies]
# Only for the TLS proxy, which is a fallback for an unpatched game. The
# supervisor always patches, so most people will never install this.
proxy = ["cryptography>=41"]
build = ["pyinstaller>=6.3"]
dev = ["pytest>=8"]

[project.scripts]
phantom-offline = "phantom_offline.__main__:main"

[tool.setuptools]
packages = ["phantom_offline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
